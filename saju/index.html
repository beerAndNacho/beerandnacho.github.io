<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 명리 · 사주 오행 리포트</title><script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script><style>:root{font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f4efe6;background:#0b0e12}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(183,127,76,.2),transparent 35%),radial-gradient(circle at 90% 15%,rgba(49,98,73,.18),transparent 28%),#0b0e12}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:38px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:52px}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.seal{width:38px;height:38px;border:1px solid #c59663;border-radius:12px;display:grid;place-items:center;color:#e0b178}.badge,.eyebrow{font-size:11px;letter-spacing:.14em;color:#d1aa7b;font-weight:800}.hero{max-width:740px;margin-bottom:28px}.hero h1{font-size:clamp(42px,8vw,76px);line-height:1.03;letter-spacing:-.055em;margin:12px 0 18px}.hero h1 em{font-style:normal;color:#d7aa76}.hero p{color:#aeb6c1;line-height:1.75;font-size:17px}.panel{border:1px solid rgba(255,255,255,.09);background:rgba(18,23,30,.82);backdrop-filter:blur(16px);border-radius:24px;padding:25px;box-shadow:0 18px 50px rgba(0,0,0,.2);margin-top:18px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{flex:1;border:1px solid rgba(255,255,255,.09);background:#10161d;color:#b7bec7;padding:12px;border-radius:12px;cursor:pointer}.tab.on{border-color:#c59562;color:#f6e7d5;background:#1d1814}.grid{display:grid;grid-template-columns:1.3fr 1fr .85fr;gap:12px}label{display:grid;gap:7px;color:#c7cbd2;font-size:13px;font-weight:700}input,select{width:100%;padding:14px 15px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:#0e141b;color:white;font:inherit}button.primary{width:100%;margin-top:15px;padding:15px;border:0;border-radius:13px;background:linear-gradient(135deg,#dab078,#a76740);color:#17100b;font-weight:900;font:inherit;cursor:pointer}.check{display:flex;gap:8px;align-items:center;margin-top:12px;color:#9ea7b2;font-size:13px}.check input{width:auto}.error{color:#ff9a8f;font-size:13px}.results{display:none}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.fact{padding:17px;border-radius:16px;background:#0f151c;border:1px solid rgba(255,255,255,.06)}.fact small{display:block;color:#7d8793;margin-bottom:8px}.fact b{font-size:20px}.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pillar{text-align:center;padding:18px 8px;border-radius:16px;background:#0e141b;border:1px solid rgba(255,255,255,.06)}.pillar small{display:block;color:#77818c;margin-bottom:8px}.pillar b{font-size:30px;color:#f3e2cd}.pillar span{display:block;margin-top:8px;color:#d3a675;font-size:12px}.sectionTitle{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.sectionTitle h2{font-size:22px;margin:0}.sectionTitle span{color:#7d8792;font-size:12px}.elements{display:grid;gap:15px}.row{display:grid;grid-template-columns:56px 1fr 26px;align-items:center;gap:10px}.bar{height:10px;background:#0a0f14;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9f633f,#d8ad75);border-radius:99px}.insight h2{font-size:clamp(26px,5vw,42px);margin:10px 0}.insight p{color:#b5bdc7;line-height:1.75}.tips{display:grid;gap:8px;margin-top:16px}.tip{background:rgba(255,255,255,.04);padding:12px 14px;border-radius:12px;color:#b3bbc4;font-size:14px}.notice{color:#68727e;font-size:11px;line-height:1.6;margin-top:18px}footer{text-align:center;color:#505b67;font-size:11px;margin-top:30px}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.grid label:last-child{grid-column:1/-1}.facts{grid-template-columns:1fr}.pillars{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.grid label:last-child{grid-column:auto}.panel{padding:19px}.top{margin-bottom:34px}.hero h1{font-size:44px}}</style></head><body><main class="shell"><div class="top"><div class="brand"><span class="seal">萬</span><span>오늘의 명리</span></div><span class="badge">MULTI · 001 / 100</span></div><section class="hero"><span class="eyebrow">SAJU · FIVE ELEMENT REPORT</span><h1>타고난 흐름을<br><em>가볍고 선명하게.</em></h1><p>생년월일과 시간을 바탕으로 사주 네 기둥, 일간, 띠와 오행 균형을 계산해 자기이해 리포트로 보여줍니다.</p></section><section class="panel"><div class="tabs"><button class="tab on" data-cal="solar">양력</button><button class="tab" data-cal="lunar">음력</button></div><form id="form"><div class="grid"><label>생년월일<input id="date" type="date" value="1990-01-01" required></label><label>출생시간<input id="time" type="time" value="12:00"></label><label>성별<select id="gender"><option>남성</option><option>여성</option></select></label></div><label class="check"><input id="unknown" type="checkbox"> 출생시간을 모릅니다</label><label class="check" id="leapWrap" style="display:none"><input id="leap" type="checkbox"> 음력 윤달입니다</label><button class="primary">무료 사주 리포트 보기</button><p class="error" id="error"></p></form></section><section id="results" class="results"><div class="panel"><div class="sectionTitle"><h2>나의 기본 원국</h2><span id="dateText"></span></div><div class="facts"><div class="fact"><small>일간</small><b id="master"></b></div><div class="fact"><small>띠</small><b id="zodiac"></b></div><div class="fact"><small>핵심 균형</small><b id="balance"></b></div></div><div class="pillars" id="pillars" style="margin-top:14px"></div></div><div class="panel"><div class="sectionTitle"><h2>오행 분포</h2><span id="chars"></span></div><div id="elements" class="elements"></div></div><div class="panel insight"><span class="eyebrow">BASIC READING</span><h2 id="headline"></h2><p id="summary"></p><div class="tips" id="tips"></div><div class="notice">전통 명리학 정보를 재미와 자기이해 목적으로 제공하는 체험판입니다. 건강·재정·법률 등 중요한 의사결정의 근거로 사용하지 마세요.</div></div></section><footer>Multi Project 001 · Saju Report</footer></main><script>let calendar='solar';const E=['목','화','토','금','수'],map={木:'목',火:'화',土:'토',金:'금',水:'수'},gan={甲:['갑','목','양'],乙:['을','목','음'],丙:['병','화','양'],丁:['정','화','음'],戊:['무','토','양'],己:['기','토','음'],庚:['경','금','양'],辛:['신','금','음'],壬:['임','수','양'],癸:['계','수','음']},z={鼠:'쥐',牛:'소',虎:'호랑이',兔:'토끼',龙:'용',龍:'용',蛇:'뱀',马:'말',馬:'말',羊:'양',猴:'원숭이',鸡:'닭',雞:'닭',狗:'개',猪:'돼지',豬:'돼지'},tips={목:['새로운 기술이나 취미를 배우며 성장 자극을 만들기','작은 실행 단위로 쪼개 시작 횟수를 늘리기','새로운 사람과 환경에 연결되는 시간 만들기'],화:['생각을 말·글·콘텐츠로 표현하기','짧고 선명한 목표로 추진력 끌어올리기','운동으로 에너지 순환 만들기'],토:['수면·식사·업무 시간을 일정하게 유지하기','반복 가능한 작은 루틴을 우선하기','돈과 일정을 숫자로 정리하기'],금:['해야 할 일과 하지 않을 일 구분하기','정리·삭제·마감 행동 늘리기','감정과 사실을 분리해 판단 기준 적기'],수:['혼자 생각하고 정리하는 시간을 일정에 넣기','읽기·기록·대화로 새 정보 받아들이기','대안을 두세 개 준비해 유연성 높이기']};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{calendar=b.dataset.cal;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));leapWrap.style.display=calendar==='lunar'?'flex':'none'});unknown.onchange=()=>time.disabled=unknown.checked;form.onsubmit=e=>{e.preventDefault();error.textContent='';try{if(typeof Solar==='undefined'||typeof Lunar==='undefined')throw Error('달력 라이브러리를 불러오지 못했습니다. 네트워크를 확인해 주세요.');let [yy,mm,dd]=date.value.split('-').map(Number),[hh,mi]=time.value.split(':').map(Number);if(unknown.checked){hh=12;mi=0}let lunar=calendar==='lunar'?Lunar.fromYmdHms(yy,leap.checked?-mm:mm,dd,hh,mi,0):Solar.fromYmdHms(yy,mm,dd,hh,mi,0).getLunar(),ec=lunar.getEightChar(),all=[['년주',ec.getYear(),ec.getYearWuXing()],['월주',ec.getMonth(),ec.getMonthWuXing()],['일주',ec.getDay(),ec.getDayWuXing()],['시주',ec.getTime(),ec.getTimeWuXing()]],ps=unknown.checked?all.slice(0,3):all,c={목:0,화:0,토:0,금:0,수:0};ps.forEach(p=>[...p[2]].forEach(ch=>{if(map[ch])c[map[ch]]++}));let strong=[...E].sort((a,b)=>c[b]-c[a])[0],weak=[...E].sort((a,b)=>c[a]-c[b])[0],dg=ec.getDay().slice(0,1),info=gan[dg]||[dg,strong,''],animal=lunar.getYearShengXiao();master.textContent=`${dg}(${info[0]}) · ${info[2]}${info[1]}`;zodiac.textContent=(z[animal]||animal)+'띠';balance.textContent=`${strong} 강 · ${weak} 보완`;dateText.textContent=`양력 ${lunar.getSolar().toYmd()} · 음력 ${lunar.toString()}`;chars.textContent=`${unknown.checked?6:8}글자 기준`;pillars.innerHTML=ps.map(p=>`<article class="pillar"><small>${p[0]}</small><b>${p[1]}</b><span>${p[2]}</span></article>`).join('');let mx=Math.max(...Object.values(c),1);elements.innerHTML=E.map(x=>`<div class="row"><b>${x}</b><div class="bar"><i style="width:${c[x]/mx*100}%"></i></div><span>${c[x]}</span></div>`).join('');headline.textContent=`${strong}의 힘을 살리고, ${weak}를 보완하세요.`;summary.textContent=`${info[2]}${info[1]} 성향의 ${info[0]} 일간을 중심으로, 원국에서는 ${strong} 기운이 가장 두드러집니다. ${weak} 기운은 상대적으로 적어 일상에서 의식적인 보완 포인트를 만드는 방식으로 활용해 볼 수 있습니다.`;document.getElementById('tips').innerHTML=tips[weak].map(t=>`<div class="tip">✓ ${t}</div>`).join('');results.style.display='block';results.scrollIntoView({behavior:'smooth',block:'start'})}catch(err){error.textContent=err.message||'날짜를 계산하지 못했습니다. 입력값을 확인해 주세요.'}};</script></body></html>
