<style>
*{box-sizing:border-box}html{background:#f7f4ef;color:#26221f}body{margin:0;font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#fff4ef 0,transparent 34%),#f7f4ef;color:#26221f}button,input{font:inherit}button{cursor:pointer}.app{width:min(760px,calc(100% - 32px));margin:auto;min-height:100vh;padding:24px 0 72px}.head{height:52px;display:flex;align-items:center;justify-content:space-between;color:#8a8078;font-size:13px}.logo{font-weight:900;color:#26221f}.progress{height:5px;background:#e6dfd8;border-radius:99px;overflow:hidden;margin:14px 0 54px}.progress i{display:block;height:100%;background:#ff6b5f;border-radius:inherit;transition:.3s}.card{background:rgba(255,255,255,.84);border:1px solid rgba(91,72,60,.12);border-radius:32px;padding:46px;box-shadow:0 24px 70px rgba(72,54,43,.08)}.count{font-size:13px;font-weight:900;color:#ff6b5f;letter-spacing:.08em}.count span{color:#b0a59c}.card h1{font-size:clamp(34px,7vw,54px);line-height:1.15;letter-spacing:-.055em;margin:20px 0 12px}.desc{color:#7c7169;line-height:1.7;margin:0 0 34px}.options{display:grid;gap:10px}.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{min-height:62px;display:flex;align-items:center;justify-content:space-between;text-align:left;border:1px solid #e5ddd7;background:#fff;color:#302a26;border-radius:18px;padding:0 20px;font-weight:800}.opt.active{border-color:#ff6b5f;background:#fff7f5;box-shadow:0 0 0 2px rgba(255,107,95,.08)}.check{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px}.opt.active .check{background:#ff6b5f}.custom{display:block;background:#f7f3ef;border-radius:18px;padding:16px 18px}.custom span{display:block;font-size:12px;color:#8b7f76;font-weight:800;margin-bottom:8px}.custom input{width:100%;border:0;outline:0;background:transparent;font-size:18px;font-weight:800}.actions{display:flex;gap:10px;margin-top:34px}.actions button{height:56px;border-radius:16px;font-weight:900}.back{width:110px;border:1px solid #e4ddd7;background:#fff;color:#776c64}.back:disabled{opacity:.35}.next{flex:1;border:0;background:#26221f;color:#fff;padding:0 20px;display:flex;justify-content:space-between;align-items:center}.privacy{text-align:center;color:#a09790;font-size:12px;margin-top:18px}.result{width:min(860px,calc(100% - 32px))}.hero{text-align:center;padding:48px 28px 42px}.kicker{display:inline-flex;padding:8px 12px;border-radius:999px;background:#ffe6e1;color:#ce4d43;font-size:12px;font-weight:900}.score{width:116px;height:116px;border-radius:50%;display:flex;align-items:baseline;justify-content:center;margin:24px auto;background:#26221f;color:#fff;padding-top:34px;box-shadow:0 16px 36px rgba(38,34,31,.18)}.score strong{font-size:42px}.score span{font-size:12px;color:#bfb7b1}.hero h1{font-size:clamp(38px,7vw,62px);letter-spacing:-.055em;line-height:1.08;margin:20px auto 16px;max-width:700px}.hero p{max-width:660px;margin:auto;color:#776d66;line-height:1.8}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:24px}.chips span{border:1px solid #ddd4cd;background:#fff;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.summary div{background:#fff;border:1px solid #e4dcd6;border-radius:22px;padding:20px}.summary span{display:block;font-size:12px;color:#958980;margin-bottom:7px}.panel{background:#fff;border:1px solid #e4dcd6;border-radius:30px;padding:34px;margin-bottom:16px}.panel .eyebrow{font-size:11px;letter-spacing:.14em;color:#ff6b5f;font-weight:900}.panel h2{font-size:28px;letter-spacing:-.04em;margin:8px 0 30px}.item{display:grid;grid-template-columns:58px 48px 1fr;gap:10px;position:relative;min-height:150px}.item:not(:last-child):after{content:"";position:absolute;left:81px;top:44px;bottom:-6px;width:1px;background:#e7dfd9}.time{font-size:12px;font-weight:900;color:#958980;padding-top:13px}.dot{position:relative;z-index:1;width:44px;height:44px;border-radius:15px;background:#fff2ee;display:grid;place-items:center;font-size:20px}.copy{padding:8px 0 26px}.copy small{font-size:10px;color:#b0a69f;font-weight:900}.copy h3{font-size:20px;margin:5px 0 9px}.copy p{margin:0;color:#736961;line-height:1.65}.copy em{display:block;font-style:normal;color:#c25a51;font-size:12px;font-weight:800;margin-top:9px}.reason{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:16px;border-radius:18px;background:#faf7f4;margin-bottom:10px}.reason b{color:#ff6b5f;font-size:12px}.reason p{margin:0;color:#655c56;line-height:1.65}.tip{margin-top:18px;background:#26221f;color:#fff;border-radius:20px;padding:20px}.tip b{font-size:11px;color:#ffb1aa}.tip p{margin:7px 0 0;line-height:1.65;color:#eee7e2}.result-actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin:18px 0}.result-actions button{min-height:54px;border-radius:16px;border:1px solid #ddd5cf;background:#fff;font-weight:900}.result-actions .primary{border-color:#26221f;background:#26221f;color:#fff}.result-actions .wide{grid-column:1/-1;border:0;background:transparent;color:#8a7f77}.test{border:1px dashed #d8cec7;border-radius:20px;padding:20px;color:#7d726a;font-size:13px;line-height:1.65}.test p{margin:6px 0 0}.notice{text-align:center;color:#ce4d43;font-size:12px;font-weight:800}@media(max-width:640px){.app{width:min(100% - 22px,760px);padding-top:12px}.progress{margin-bottom:28px}.card{padding:28px 18px;border-radius:25px}.card h1{font-size:37px}.area-grid{grid-template-columns:1fr}.back{width:82px}.result{width:min(100% - 22px,860px)}.hero{padding:32px 10px}.summary{grid-template-columns:1fr}.panel{padding:24px 18px}.item{grid-template-columns:50px 42px 1fr;gap:7px}.item:not(:last-child):after{left:70px}.dot{width:40px;height:40px}.result-actions{grid-template-columns:1fr 1fr}.result-actions .primary{grid-column:1/-1}}

<script>
const GA_ID="",CLARITY_ID="";
if(GA_ID){const s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;document.head.appendChild(s);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config',GA_ID)}
if(CLARITY_ID){(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src='https://www.clarity.ms/tag/'+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y)})(window,document,'clarity','script',CLARITY_ID)}
function track(n,p={}){window.gtag&&gtag('event',n,p);window.clarity&&clarity('event',n);if(window.clarity)Object.entries(p).forEach(([k,v])=>clarity('set',k,String(v)))}
const areas=['성수','연남','잠실','익선동','을지로','한남','광안리'], rels=['첫 데이트','썸','연인','장기연애','기념일'], budgets=['3만원 이하','5만원대','10만원대','15만원 이상'], durations=['2시간','4시간','반나절','하루'], indoors=['실내 위주','반반','야외 위주'], moods=['대화','감성','활동','맛집','특별함'], transports=['도보','대중교통','차량'];
let profile={area:'성수',relationship:'썸',budget:'5만원대',duration:'4시간',indoor:'반반',mood:'대화',transport:'도보'},step=0,variant=0,result=null,notice='';try{const x=localStorage.getItem('date-course-profile');if(x)profile={...profile,...JSON.parse(x)}}catch(e){}
const qs=[['어디에서 만날까요?','동네만 정해도 코스의 분위기가 꽤 달라져요.'],['지금 두 사람은 어떤 사이인가요?','관계 단계에 따라 대화와 활동의 비중을 조절할게요.'],['오늘 예산은 어느 정도인가요?','2인 기준으로 생각해 주세요.'],['얼마나 함께할 예정인가요?','짧은 만남은 여백을, 긴 데이트는 리듬을 중요하게 봐요.'],['실내와 야외 중 어디가 더 좋아요?','날씨가 애매하다면 반반이 가장 무난해요.'],['오늘 가장 원하는 분위기는?','하나만 고르면 코스의 중심을 확실하게 잡을 수 있어요.'],['이동은 어떻게 할까요?','이동 피로까지 고려해서 장소 간 간격을 조절할게요.']];
const acts={대화:[['☕','조용한 카페에서 워밍업','서로의 속도에 맞춰 이야기하기 좋은 자리부터 시작해요.'],['🚶','천천히 걷는 동네 산책','목적지보다 대화에 집중할 수 있게 이동 자체를 데이트로 만들어요.'],['🍽️','대화가 이어지는 저녁','너무 시끄럽지 않은 식사 공간에서 이야기를 이어가요.'],['🍨','가벼운 디저트 마무리','부담 없이 오늘의 데이트를 정리할 시간을 남겨요.']],감성:[['🖼️','작은 전시·서점 둘러보기','서로의 취향을 발견할 수 있는 장면을 만들어요.'],['☕','분위기 좋은 카페','공간의 분위기를 같이 즐겨요.'],['🌿','풍경 있는 산책','걷는 동안 기억에 남을 장면을 만들어요.'],['🌙','야경 또는 밤 산책','오늘의 분위기를 길게 남겨요.']],활동:[['🎯','가벼운 체험으로 시작','같이 웃을 수 있는 활동부터 시작해요.'],['🎮','둘이 하는 미션형 활동','승부보다 협동이 필요한 체험을 골라요.'],['🍜','활동 후 편한 식사','체험 뒤에는 편한 식사 시간을 둬요.'],['🥤','산책하며 음료 한 잔','텐션을 천천히 낮추며 마무리해요.']],맛집:[['🥐','가벼운 첫 메뉴','첫 장소부터 너무 무겁지 않게 시작해요.'],['🍽️','오늘의 메인 맛집','예산의 가장 큰 비중을 메인 식사에 배정해요.'],['☕','취향 맞추는 카페','서로 좋아하는 맛을 하나 더 찾아봐요.'],['🍰','시그니처 디저트','마지막 한 메뉴를 같이 고르는 재미를 남겨요.']],특별함:[['🎟️','예약해 둔 특별한 경험','평소와 다른 경험을 코스의 중심에 둬요.'],['📸','기억에 남는 포인트','둘만의 사진이나 기록을 남겨요.'],['🍷','조금 더 좋은 저녁','평소보다 한 단계 특별한 식사에 예산을 집중해요.'],['🌙','야경과 작은 이벤트','마지막에 편지나 선물을 건네기 좋은 여백을 둬요.']]};
const bc={'3만원 이하':'2인 약 20,000~35,000원','5만원대':'2인 약 40,000~65,000원','10만원대':'2인 약 80,000~120,000원','15만원 이상':'2인 약 140,000원 이상'}, counts={'2시간':2,'4시간':3,'반나절':4,'하루':4}, times={'2시간':['14:00','15:10'],'4시간':['14:00','15:20','17:10'],'반나절':['14:00','15:30','17:20','19:00'],'하루':['11:30','14:00','17:00','19:30']};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function hash(s){let h=0;for(const c of s)h=((h<<5)-h+c.charCodeAt(0))|0;return Math.abs(h)}
function generate(){const seed=hash(JSON.stringify(profile)+variant),src=[...acts[profile.mood]],off=seed%src.length,ord=[...src.slice(off),...src.slice(0,off)].slice(0,counts[profile.duration]),r={"첫 데이트":'첫 데이트라 이동을 복잡하게 만들지 않고 대화와 자연스러운 종료 타이밍을 우선했어요.',썸:'썸 단계라 함께할 거리와 대화 시간을 반반 섞어 어색한 공백을 줄였어요.',연인:'익숙함 속에서도 새로운 장면이 생기도록 취향 활동과 여유 시간을 섞었어요.',장기연애:'늘 하던 코스처럼 느껴지지 않도록 한 가지 새로운 경험을 중심에 넣었어요.',기념일:'기념일답게 기억에 남을 포인트와 마지막 여운을 크게 잡았어요.'},ir={'실내 위주':'실내 체류 시간을 길게 잡아 날씨와 이동 피로의 영향을 줄였어요.',반반:'실내와 산책을 번갈아 넣어 지루하지 않으면서도 쉬어갈 수 있게 했어요.','야외 위주':'걷고 풍경을 보는 시간이 충분하도록 이동 자체를 코스의 일부로 봤어요.'},mv={도보:'도보 중심 · 장소 간 10~20분 이내 권장',대중교통:'도보 + 대중교통 · 환승 1회 이내 권장',차량:'차량 이동 · 주차 가능한 장소 우선 권장'};result={score:92+seed%7,title:`${profile.area}에서 즐기는 ${profile.mood} 중심 데이트`,subtitle:`${profile.relationship}인 두 사람에게 ${profile.duration} 동안 부담 없이 이어지는 흐름으로 구성했어요.`,tags:[profile.relationship,profile.mood,profile.indoor,profile.budget],budget:bc[profile.budget],move:mv[profile.transport],steps:ord.map((x,i)=>({time:times[profile.duration][i],icon:x[0],title:x[1],desc:`${profile.area} 안에서 ${x[2]}`,why:i===0?'첫 장소는 긴장도를 낮추는 역할':i===ord.length-1?'마지막은 다음 만남을 약속하기 좋은 여운':'앞뒤 일정의 텐션을 자연스럽게 연결'})),reasons:[r[profile.relationship],ir[profile.indoor],`${profile.budget} 예산 안에서 메인 경험에 지출이 몰리도록 구성했어요.`],tip:profile.relationship==='첫 데이트'?'첫 데이트는 한 장소를 더 넣는 것보다, 잘 끝낼 타이밍을 남겨두는 편이 좋아요.':'마지막 장소 하나는 현장에서 둘이 같이 고르면 계획된 코스도 덜 정형적으로 느껴져요.'};localStorage.setItem('date-course-profile',JSON.stringify(profile));track('date_course_generated',{relationship:profile.relationship,budget:profile.budget,duration:profile.duration,mood:profile.mood,area_type:areas.includes(profile.area)?'preset':'custom'});render();scrollTo({top:0,behavior:'smooth'})}
function opt(v,current,key){return `<button class="opt ${current===v?'active':''}" onclick="choose('${key}','${v.replace(/'/g,"\\'")}')"><span>${esc(v)}</span><i class="check">${current===v?'✓':''}</i></button>`}
function choose(k,v){profile[k]=v;render()}
function next(){if(step===0)track('date_wizard_start',{area_type:areas.includes(profile.area)?'preset':'custom'});track('date_question_complete',{step_number:step+1});if(step<6){step++;render()}else generate()}
function prev(){step=Math.max(0,step-1);render()}
function areaInput(v){profile.area=v}
function restart(){result=null;step=0;notice='';track('date_course_restart');render();scrollTo({top:0,behavior:'smooth'})}
function regen(){variant++;track('date_course_regenerate',{variant});generate()}
async function share(){const text=result.title+'\n'+result.steps.map(s=>s.time+' '+s.title).join(' → ')+'\n'+result.budget;track('share',{content_type:'date_course'});try{if(navigator.share)await navigator.share({title:result.title,text,url:location.href});else{await navigator.clipboard.writeText(text+'\n'+location.href);notice='코스를 복사했어요.';render()}}catch(e){}}
function save(){localStorage.setItem('date-course-last-result',JSON.stringify({profile,result}));track('date_course_save',{mood:profile.mood});notice='이 기기에서 코스를 저장했어요.';render()}
function render(){const root=document.getElementById('root');if(result){root.className='app result';root.innerHTML=`<header class="head"><button class="logo" onclick="restart()" style="border:0;background:none;padding:0">우리 둘 코스</button><span>취향 맞춤 데이트 플래너</span></header><section class="hero"><div class="kicker">당신들의 데이트 매칭</div><div class="score"><strong>${result.score}</strong><span>/100</span></div><h1>${esc(result.title)}</h1><p>${esc(result.subtitle)}</p><div class="chips">${result.tags.map(x=>`<span>${esc(x)}</span>`).join('')}</div></section><section class="summary"><div><span>예상 예산</span><strong>${result.budget}</strong></div><div><span>이동 방식</span><strong>${result.move}</strong></div></section><section class="panel"><span class="eyebrow">YOUR DATE FLOW</span><h2>시간 순서대로 이렇게 가보세요</h2>${result.steps.map((s,i)=>`<article class="item"><div class="time">${s.time}</div><div class="dot">${s.icon}</div><div class="copy"><small>STEP ${i+1}</small><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p><em>${esc(s.why)}</em></div></article>`).join('')}</section><section class="panel"><span class="eyebrow">WHY IT FITS</span><h2>왜 두 사람에게 맞을까요?</h2>${result.reasons.map((x,i)=>`<div class="reason"><b>0${i+1}</b><p>${esc(x)}</p></div>`).join('')}<div class="tip"><b>작은 팁</b><p>${esc(result.tip)}</p></div></section><section class="result-actions"><button class="primary" onclick="regen()">같은 조건으로 다른 코스</button><button onclick="share()">공유하기</button><button onclick="save()">저장하기</button><button class="wide" onclick="restart()">조건 다시 고르기</button></section>${notice?`<p class="notice">${esc(notice)}</p>`:''}<section class="test"><b>테스트 버전</b><p>현재는 특정 가게의 실시간 영업정보가 아니라 지역 분위기와 활동 조합을 추천합니다. 다음 단계에서 지도·실시간 장소 추천을 연결할 수 있어요.</p></section>`;return}
const [t,d]=qs[step];let body='';if(step===0)body=`<div class="area-grid">${areas.map(v=>opt(v,profile.area,'area')).join('')}</div><label class="custom"><span>다른 지역 직접 입력</span><input value="${areas.includes(profile.area)?'':esc(profile.area)}" placeholder="예: 수원 행궁동, 대전 둔산동" oninput="areaInput(this.value)"></label>`;else{const lists=[null,rels,budgets,durations,indoors,moods,transports],keys=[null,'relationship','budget','duration','indoor','mood','transport'];body=lists[step].map(v=>opt(v,profile[keys[step]],keys[step])).join('')}root.className='app';root.innerHTML=`<header class="head"><span class="logo">우리 둘 코스</span><span>약 1분</span></header><div class="progress"><i style="width:${(step+1)/7*100}%"></i></div><section class="card"><div class="count">${String(step+1).padStart(2,'0')} <span>/ 07</span></div><h1>${t}</h1><p class="desc">${d}</p><div class="options">${body}</div><div class="actions"><button class="back" ${step===0?'disabled':''} onclick="prev()">이전</button><button class="next" onclick="next()"><span>${step===6?'내 코스 만들기':'다음'}</span><span>→</span></button></div></section><p class="privacy">입력값은 이 기기에만 저장되며 서버로 전송하지 않습니다.</p>`}
render();
</script></body></html>
