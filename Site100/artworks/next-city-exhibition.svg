<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">NEXT CITY 미래도시 전시 아트 디렉션</title><description id="description">미래도시 전시의 experimental 시각 언어. 미래 지도, 도시 데이터, 전시 핀, 공간 레이어 소재를 사용합니다.</description><defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(330.8 60% 54%)"/><stop offset="1" stop-color="hsl(104.8 49% 57%)"/></linearGradient>
