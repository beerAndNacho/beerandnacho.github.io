<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">REMEMBER 추모 기록관 아트 디렉션</title><description id="description">추모 기록관의 experimental 시각 언어. 빛 밝히기, 문서 아카이브, 사진 여백, 기억 문장 소재를 사용합니다.</description><defs>
