<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">AIR NOTE 홈 프래그런스 아트 디렉션</title><description id="description">홈 프래그런스의 catalog 시각 언어. 향 원형 차트, 연기 선, 노트 카드, 유리병 소재를 사용합니다.</description><defs>
