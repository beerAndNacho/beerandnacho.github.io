<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">100WORLDS 디자인 갤러리 아트 디렉션</title><description id="description">디자인 갤러리의 experimental 시각 언어. 100개 미니 프리뷰, 디자인 지문, 필터 매트릭스, 비교 보드 소재를 사용합니다.</description><defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(108.3 60% 54%)"/><stop offset="1" stop-color="hsl(242.3 49% 57%)"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(22.3 22% 82%)" stop-opacity=".03"/><stop offset="1" stop-color="hsl(180.3 28% 12%)" stop-opacity=".34"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="18" dy="22" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="3" stitchTiles="stitch" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="hsl(22.3 22% 82%)" stroke-opacity=".14" stroke-width="1"/></pattern>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="hsl(22.3 22% 82%)" fill-opacity=".15"/></pattern>
  </defs><rect width="1200" height="900" fill="hsl(350.3 26% 17%)"/><circle cx="420" cy="430" r="330" fill="hsl(108.3 60% 54%)" opacity=".12"/><circle cx="760" cy="360" r="270" fill="hsl(242.3 49% 57%)" opacity=".14"/><g transform="translate(318 374) rotate(0)" filter="url(#shadow)"><rect width="270" height="199" rx="24" fill="hsl(108.3 60% 54%)" fill-opacity=".76" stroke="hsl(22.3 22% 82%)" stroke-width="3"/><rect width="270" height="34" fill="hsl(180.3 28% 12%)" fill-opacity=".78"/><circle cx="18" cy="17" r="5" fill="hsl(22.3 22% 82%)"/><circle cx="36" cy="17" r="5" fill="hsl(22.3 22% 82%)" opacity=".5"/><text x="18" y="179" fill="hsl(180.3 28% 12%)" font-family="ui-monospace" font-size="13" font-weight="900">100개 미니 프리뷰</text></g><g transform="translate(405 501) rotate(5)" filter="url(#shadow)"><rect width="242" height="319" rx="0" fill="hsl(242.3 49% 57%)" fill-opacity=".76" stroke="hsl(22.3 22% 82%)" stroke-width="3"/><rect width="242" height="34" fill="hsl(180.3 28% 12%)" fill-opacity=".78"/><circle cx="18" cy="17" r="5" fill="hsl(22.3 22% 82%)"/><circle cx="36" cy="17" r="5" fill="hsl(22.3 22% 82%)" opacity=".5"/><text x="18" y="299" fill="hsl(180.3 28% 12%)" font-family="ui-monospace" font-size="13" font-weight="900">디자인 지문</text></g><g transform="translate(532 321) rotate(4)" filter="url(#shadow)"><rect width="280" height="156" rx="0" fill="hsl(108.3 60% 54%)" fill-opacity=".76" stroke="hsl(22.3 22% 82%)" stroke-width="3"/><rect width="280" height="34" fill="hsl(180.3 28% 12%)" fill-opacity=".78"/><circle cx="18" cy="17" r="5" fill="hsl(22.3 22% 82%)"/><circle cx="36" cy="17" r="5" fill="hsl(22.3 22% 82%)" opacity=".5"/><text x="18" y="136" fill="hsl(180.3 28% 12%)" font-family="ui-monospace" font-size="13" font-weight="900">필터 매트릭스</text></g><g transform="translate(377 569) rotate(-7)" filter="url(#shadow)"><rect width="444" height="212" rx="24" fill="hsl(242.3 49% 57%)" fill-opacity=".76" stroke="hsl(22.3 22% 82%)" stroke-width="3"/><rect width="444" heig