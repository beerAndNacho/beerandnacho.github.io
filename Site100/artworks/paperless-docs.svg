<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">PAPERLESS 문서 SaaS 아트 디렉션</title><description id="description">문서 SaaS의 interface 시각 언어. 빈 문서, 변환 블록, 승인 도장, 검색 바 소재를 사용합니다.</description><defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(348.2 72% 51%)"/><stop offset="1" stop-color="hsl(122.2 58% 60%)"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(262.2 22% 91%)" stop-opacity=".03"/><stop offset="1" stop-color="hsl(60.2 28% 9%)" stop-opacity=".34"/></linearGradient>
