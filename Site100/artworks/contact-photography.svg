<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">CONTACT 사진작가 아트 디렉션</title><description id="description">사진작가의 studio 시각 언어. 콘택트시트, 암실 라이트, 필름 번호, 사진 프레임 소재를 사용합니다.</description><defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(328.9 64% 53%)"/><stop offset="1" stop-color="hsl(102.9 52% 58%)"/></linearGradient>
