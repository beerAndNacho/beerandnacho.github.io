<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">OPEN STUDIO 미술학교 아트 디렉션</title><description id="description">미술학교의 notebook 시각 언어. 핀보드, 재료 조각, 작품 카드, 손글씨 메모 소재를 사용합니다.</description><defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(217.3 68% 52%)"/><stop offset="1" stop-color="hsl(351.3 55% 59%)"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(131.3 22% 88%)" stop-opacity=".03"/><stop offset="1" stop-color="hsl(289.3 28% 10%)" stop-opacity=".34"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="18" dy="22" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="3" stitchTiles="stitch" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="hsl(131.3 22% 88%)" stroke-opacity=".14" stroke-width="1"/></pattern>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="hsl(131.3 22% 88%)" fill-opacity=".15"/></pattern>
  </defs><rect width="1200" height="900" fill="hsl(131.3 22% 88%)"/><path d="M0 135h1200M0 175h1200M0 215h1200M0 255h1200M0 295h1200M0 335h1200M0 375h1200M0 415h1200M0 455h1200M0 495h1200M0 535h1200M0 575h1200M0 615h1200M0 655h1200M0 695h1200M0 735h1200M0 775h1200" stroke="hsl(289.3 28% 10%)" stroke-opacity=".09"/><path d="M66 0v900" stroke="hsl(351.3 55% 59%)" stroke-width="4" opacity=".45"/><g transform="translate(100 180) rotate(-2)"><rect width="420" height="195" rx="8" fill="hsl(217.3 68% 52%)" opacity=".82"/><path d="M30 68h330M30 103h280M30 138h350" stroke="hsl(289.3 28% 10%)" stroke-opacity=".55" stroke-width="4"/><text x="28" y="45" fill="hsl(289.3 28% 10%)" font-family="system-ui" font-size="17" font-weight="900">핀보드</text></g><g transform="translate(570 180) rotate(3)"><rect width="420" height="195" rx="8" fill="hsl(351.3 55% 59%)" opacity=".82"/><path d="M30 68h330M30 103h280M30 138h350" stroke="hsl(289.3 28% 10%)" stroke-opacity=".55" stroke-width="4"/><text x="28" y="45" fill="hsl(289.3 28% 10%)" font-family="system-ui" font-size="17" font-weight="900">재료 조각</text></g><g transform="translate(100 430) rotate(2)"><rect width="420" height="195" rx="8" fill="hsl(131.3 22% 88%)" opacity=".92"/><path d="M30 68h330M30 103h280M30 138h350" stroke="hsl(289.3 28% 10%)" stroke-opacity=".55" stroke-width="4"/><text x="28" y="45" fill="hsl(289.3 28% 10%)" font-family="system-ui" font-size="17" font-weight="900">작품 카드</text></g><g transform="translate(570 430) rotate(-3)"><rect width="420" height="195" rx="8" fill="hsl(217.3 68% 52%)" opacity=".82"/><path d="M30 68h330M30 103h280M30 138h350" stroke="hsl(289.3 28% 10%)" stroke-opacity=".55" stroke-width="4"/><text x="28" y="45" fill="hsl(289.3 28% 10%)" font-family="system-ui" font-size="17" font-weight="900">손글씨 메모</text></g><g fill="hsl(289.3 28% 10%)" font-family="system-ui, sans-serif">
    <text x="70" y="95" font-size="18" font-weight="900" letter-spacing="4">WORLD 033</text>
    <text x="70" y="760" font-size="62" font-weight="900" letter-spacing="-4">OPEN STUDIO 미술학교</text>
    <text x="72" y="804" font-size="17" font-weight="700" opacity=".64">미술학교 · radial · drag</text>
