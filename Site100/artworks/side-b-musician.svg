<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">SIDE B 뮤지션 아트 디렉션</title><description id="description">뮤지션 포트폴리오의 experimental 시각 언어. 회전 음반, 트랙 리스트, 재생 바, 공연 포스터 소재를 사용합니다.</description><defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(225.7 60% 54%)"/><stop offset="1" stop-color="hsl(359.7 49% 57%)"/></linearGradient>
