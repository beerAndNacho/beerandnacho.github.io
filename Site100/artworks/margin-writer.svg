<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">MARGIN 작가 포트폴리오 아트 디렉션</title><description id="description">작가 포트폴리오의 experimental 시각 언어. 원고지, 여백 주석, 교정 부호, 문장 카드 소재를 사용합니다.</description><defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(88.2 60% 54%)"/><stop offset="1" stop-color="hsl(222.2 49% 57%)"/></linearGradient>
