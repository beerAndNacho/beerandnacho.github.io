<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">ROOTS 가족 역사 기록 아트 디렉션</title><description id="description">가족 역사 기록의 experimental 시각 언어. 가계도 선, 연도 노드, 사진 액자, 기억 메모 소재를 사용합니다.</description><defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(278.3 60% 54%)"/><stop offset="1" stop-color="hsl(52.3 49% 57%)"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(192.3 22% 82%)" stop-opacity=".03"/><stop offset="1" stop-color="hsl(350.3 28% 12%)" stop-opacity=".34"/></linearGradient>
