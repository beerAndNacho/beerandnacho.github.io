function lab(k,val){let g=C.find(x=>x[0]===k),i=g[2].find(x=>String(x[0])===String(val));return i?i[1]:val}function sc(x){let s=0,e=E[p.energy];s+=x.energy.includes(e)?6:-Math.min(...x.energy.map(a=>Math.abs(a-e)))*3;s+=p.time>=x.minTime?4:-7;s+=p.budget>=x.budget?4:-6;s+=(x.company.includes(p.company)||x.company.includes("any"))?3:-4;s+=(p.setting==="any"||x.setting.includes(p.setting)||x.setting.includes("any"))?3:-4;s+=x.mood.includes(p.mood)?5:0;return s}function ranks(){return P.map(x=>({...x,_s:sc(x)})).sort((a,b)=>b._s-a._s)}function cur(){rank=ranks();return rank[v%Math.min(5,rank.length)]}
function controls(){controls=document.getElementById("controls");controls.innerHTML=C.map(g=>`<div class="row"><div class="lab">${g[1]}</div><div class="opts">${g[2].map(x=>`<button class="opt ${String(p[g[0]])===String(x[0])?"on":""}" data-k="${g[0]}" data-v="${x[0]}">${x[1]}</button>`).join("")}</div></div>`).join("");controls.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{let g=C.find(x=>x[0]===b.dataset.k),z=g[2].find(x=>String(x[0])===b.dataset.v)[0];p[b.dataset.k]=z;v=0;try{localStorage.setItem("after-work-prefs",JSON.stringify(p))}catch(e){}track("afterwork_filter_change",{filter:b.dataset.k,value:String(z)});render()})}
function result(){let x=cur();state.innerHTML=`${lab("energy",p.energy)} · ${lab("time",p.time)} · ${lab("budget",p.budget)}<br>${lab("mood",p.mood)} 쪽`;title.textContent=x.title;why.textContent=x.why;meta.innerHTML=`<span>${x.duration}</span><span>${x.spend}</span>`;let now=new Date(),base=now.getHours()*60+now.getMinutes();plan.innerHTML=x.steps.map((z,i)=>{let t=base+i*25,h=String(Math.floor((t%1440)/60)).padStart(2,"0"),m=String(t%60).padStart(2,"0");return `<div class="step"><div class="tm">${h}:${m}</div><div><div class="st">${z[1]}</div><p class="sd">${z[2]}</p></div></div>`}).join("");let aa=rank.filter(a=>a.id!==x.id).slice(0,2);alts.innerHTML=aa.map((a,i)=>`<button class="alt" data-id="${a.id}"><span class="n">0${i+1}</span><strong>${a.title}</strong><small>${a.duration}</small></button>`).join("");alts.querySelectorAll(".alt").forEach(b=>b.onclick=()=>{let i=rank.slice(0,5).findIndex(a=>a.id===b.dataset.id);if(i>=0)v=i;track("afterwork_alternative_select",{plan_id:b.dataset.id});result()});track("afterwork_recommendation_view",{plan_id:x.id,energy:p.energy,mood:p.mood})}function render(){controls();result()}function clock(){let d=new Date(),w=["일","월","화","수","목","금","토"],h=String(d.getHours()).padStart(2,"0"),m=String(d.getMinutes()).padStart(2,"0");document.getElementById("clock").textContent=`${w[d.getDay()]}요일 · ${h}:${m}`}
again.onclick=()=>{v=(v+1)%5;track("afterwork_regenerate",{variant:String(v)});result()};save.onclick=()=>{let x=cur();try{localStorage.setItem("after-work-saved-plan",JSON.stringify({savedAt:new Date().toISOString(),prefs:p,planId:x.id}));notice.textContent="오늘 저녁으로 저장했습니다.";track("afterwork_save",{plan_id:x.id})}catch(e){notice.textContent="이 브라우저에서는 저장할 수 없습니다."}};share.onclick=async()=>{let x=cur(),t=`오늘 퇴근 후: ${x.title}\n${x.duration} · ${x.spend}`;try{if(navigator.share){await navigator.share({title:"퇴근하고 뭐 하지?",text:t});track("share",{method:"web_share"})}else if(navigator.clipboard){await navigator.clipboard.writeText(t);notice.textContent="추천을 복사했습니다.";track("share",{method:"clipboard"})}}catch(e){}};clock();setInterval(clock,30000);render();
</script></body></html>
