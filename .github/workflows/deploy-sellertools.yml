name: Deploy SellerTools into user Pages site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-sellertools.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-sellertools-user-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 0

      - name: Checkout SellerTools source
        uses: actions/checkout@v4
        with:
          repository: beerAndNacho/SellerTools
          ref: main
          path: source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate SellerTools
        working-directory: source
        run: npm run check

      - name: Build SellerTools
        working-directory: source
        run: npm run build

      - name: Verify 100-tool build
        run: |
          set -euo pipefail
          test -s source/dist/index.html
          test -s source/dist/assets/catalog.js
          test -s source/dist/assets/catalog/tools01.js
          test -s source/dist/assets/catalog/tools10.js
          test -s source/dist/assets/operations.js
          test -s source/dist/assets/operations/analytics.js
          test -s source/dist/assets/portal.js
          test -s source/dist/assets/engine.js
          test -s source/dist/assets/styles.css
          test -s source/dist/sitemap.xml
          tool_count="$(find source/dist/tools -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')"
          test "$tool_count" -eq 100
          test -s source/dist/tools/net-profit-calculator/index.html
          test -s source/dist/tools/detail-page-missing-check/index.html
          test -s source/dist/tools/product-image-resizer/index.html
          test -s source/dist/tools/safety-stock-calculator/index.html
          test -s source/dist/tools/weekly-seller-report/index.html
          test -s source/dist/tools/seller-business-health/index.html
          echo "Verified $tool_count SellerTools routes."

      - name: Publish under /SellerTools
        run: |
          rm -rf site/SellerTools
          mkdir -p site/SellerTools
          cp -R source/dist/. site/SellerTools/
          touch site/SellerTools/.nojekyll

      - name: Commit deployment
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SellerTools
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'deploy: publish SellerTools 100-tool portal'
          git push
