name: verify Threecountry live page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-threecountry-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify live HTML and cinematic assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://beerandnacho.github.io/threecountry'
          for path in '/' '/styles.css' '/presentation-core.css' '/presentation-scenes.css' '/assets/main.js' '/assets/presentation.js' '/assets/content.js' '/assets/engine.js' '/assets/battle.js' '/assets/rng.js' '/assets/storage.js'; do
            echo "Checking ${base}${path}"
            curl --retry 30 --retry-delay 3 --retry-all-errors -fsSL "${base}${path}?verify=${GITHUB_RUN_ID}" -o /dev/null
          done
          curl --retry 30 --retry-delay 3 --retry-all-errors -fsSL "${base}/?verify=${GITHUB_RUN_ID}" -o /tmp/index.html
          grep -q '<div id="app"' /tmp/index.html
          grep -q './assets/main.js' /tmp/index.html
          grep -q './assets/presentation.js' /tmp/index.html
          grep -q './presentation-core.css' /tmp/index.html
          grep -q './presentation-scenes.css' /tmp/index.html
          ! grep -q 'cdn.jsdelivr.net/gh/beerAndNacho/Threecountry' /tmp/index.html

      - name: Install browser test runtime
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Play the cinematic first battle in mobile Chromium
        shell: bash
        run: |
          cat > verify-threecountry.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors = [];
          page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
          page.on('requestfailed', (request) => errors.push(`requestfailed: ${request.url()} ${request.failure()?.errorText || ''}`));

          const response = await page.goto(`https://beerandnacho.github.io/threecountry/?verify=${Date.now()}`, {
            waitUntil: 'networkidle',
            timeout: 120_000,
          });
          if (!response?.ok()) throw new Error(`Page response was ${response?.status()}`);

          await page.locator('.title-cinematic-cast').waitFor({ state: 'visible', timeout: 30_000 });
          if (await page.locator('.title-cinematic-cast .character-svg').count() < 2) throw new Error('Cinematic lord characters were not rendered.');
          await page.locator('[data-action="start-game"]').click();

          await page.locator('.opening-cinematic').waitFor({ state: 'visible', timeout: 20_000 });
          if (await page.locator('.opening-cinematic .character-svg').count() < 2) throw new Error('Opening character scene was not rendered.');
          await page.locator('[data-opening-close]').click();
          await page.locator('.opening-cinematic').waitFor({ state: 'detached', timeout: 10_000 });

          await page.locator('.map-view').waitFor({ state: 'visible', timeout: 20_000 });
          await page.locator('.season-mission').waitFor({ state: 'visible' });
          if (await page.locator('.marching-army').count() < 2) throw new Error('Map armies were not rendered.');
          await page.locator('.city-node[data-action="select-city"][data-city="chenliu"]').click();
          await page.locator('.floating-war-command').waitFor({ state: 'visible', timeout: 10_000 });
          await page.locator('.floating-war-command').click();
          await page.locator('.battle-setup').waitFor({ state: 'visible', timeout: 10_000 });
          if (await page.locator('.battle-setup .character-svg').count() < 3) throw new Error('War council characters were not rendered.');
          await page.locator('[data-action="confirm-battle"]').click();
          await page.locator('.battle-cinema').waitFor({ state: 'visible', timeout: 20_000 });
          if (await page.locator('.battle-cinema .lane-fighter').count() < 6) throw new Error('Three-line battle cast was not rendered.');
          await page.locator('[data-cinema-skip]').click();
          await page.locator('.report-banner').waitFor({ state: 'visible', timeout: 10_000 });

          if (errors.length) throw new Error(errors.join('\n'));
          console.log('Cinematic title, prologue, living map, war council, and three-line battle rendered successfully.');
          await page.screenshot({ path: '/tmp/threecountry-cinematic-live.png', fullPage: true });
          await browser.close();
          EOF
          node verify-threecountry.mjs
