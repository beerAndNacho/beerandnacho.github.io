name: Bootstrap Launch100 MVP

on:
  pull_request:
    branches: [main]
    paths:
      - '.launch100/**'
      - '.github/workflows/launch100-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-launch100-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Verify and extract source
        run: |
          set -euo pipefail
          test -s .launch100/source.zip
          echo 'ea9ea99e3ac59342670a0d6b0986e131faf52f218cff98cb353abff87d3a9a97  .launch100/source.zip' | sha256sum -c -
          rm -rf Launch100
          unzip -q .launch100/source.zip
          test -s Launch100/index.html
          test -s Launch100/assets/app.js
          test -s Launch100/assets/preview.js
          test -s Launch100/assets/templates.js
          test -s Launch100/assets/styles.css

      - name: Validate Launch100 MVP
        working-directory: Launch100
        run: npm run check

      - name: Verify browser report
        run: |
          set -euo pipefail
          node - <<'NODE'
          const report = require('./Launch100/browser-report.json');
          if (report.desktop.templates !== 10) throw new Error('Expected 10 templates');
          if (report.desktop.docWidth !== report.desktop.viewport) throw new Error('Desktop overflow detected');
          if (report.mobile.docWidth !== report.mobile.viewport) throw new Error('Mobile overflow detected');
          if (report.mobile.viewport !== 390) throw new Error('Expected 390px mobile audit');
          if (!report.sharedPreview.previewOnly) throw new Error('Shared preview audit missing');
          console.log('Verified static and browser audit report.');
          NODE

      - name: Commit unpacked source to PR branch
        run: |
          set -euo pipefail
          rm -rf .launch100
          rm -f .github/workflows/launch100-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add Launch100 website builder MVP'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
