name: Launch100 CI

on:
  push:
    branches: [main, launch100-mvp]
    paths:
      - 'Launch100/**'
      - '.github/workflows/launch100-ci.yml'
  pull_request:
    paths:
      - 'Launch100/**'
      - '.github/workflows/launch100-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Launch100 source
        working-directory: Launch100
        run: npm run check
      - name: Verify public files and browser report
        run: |
          set -euo pipefail
          test -s Launch100/index.html
          test -s Launch100/assets/styles.css
          test -s Launch100/assets/templates.js
          test -s Launch100/assets/preview.js
          test -s Launch100/assets/app.js
          test -s Launch100/assets/icon.svg
          test -s Launch100/manifest.webmanifest
          test -s Launch100/sw.js
          test -s Launch100/browser-report.json
          node - <<'NODE'
          const report = require('./Launch100/browser-report.json');
          if (report.desktop.templates !== 10) throw new Error('Expected 10 templates');
          if (report.desktop.docWidth !== 1440 || report.desktop.viewport !== 1440) throw new Error('Desktop report mismatch');
          if (report.mobile.docWidth !== 390 || report.mobile.viewport !== 390) throw new Error('Mobile report mismatch');
          if (!report.sharedPreview.previewOnly) throw new Error('Shared preview report mismatch');
          NODE
          grep -q 'https://beerandnacho.github.io/Launch100/' Launch100/index.html
