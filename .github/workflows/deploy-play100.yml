name: Deploy Play100 into user Pages site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-play100.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-play100-user-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v6
        with:
          path: site

      - name: Checkout latest Play100 main
        uses: actions/checkout@v6
        with:
          repository: beerAndNacho/Play100
          ref: main
          path: source
          persist-credentials: false

      - name: Reconstruct GAME-003 to GAME-005 source overlay
        working-directory: source
        run: |
          cat scripts/overlay-chunks/part-* | base64 -d > /tmp/play100-games-003-005-overlay.zip
          echo '8d2eb34c467080918b3a0df336786aed030ddc8e7db0cd24db669a9210c248e5  /tmp/play100-games-003-005-overlay.zip' | sha256sum -c -
          mkdir -p /tmp/play100-overlay
          unzip -q -o /tmp/play100-games-003-005-overlay.zip -d /tmp/play100-overlay
          rsync -a /tmp/play100-overlay/ ./
          rm -f APPLY.md

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Play100 dependencies
        working-directory: source
        run: npm install --no-audit --no-fund

      - name: Validate Play100
        working-directory: source
        run: npm run check

      - name: Build portal and GAME-001 to GAME-005
        working-directory: source
        run: npm run build

      - name: Add packed GAME-006 to GAME-010 builds
        run: |
          mkdir -p source/dist/games/packs
          for slug in \
            006-tiny-detective-grid \
            007-bridge-count \
            008-clockwork-repair \
            009-pipe-garden \
            010-daily-clue-board
          do
            mkdir -p "source/dist/games/$slug"
            cp "source/games/$slug/index.html" "source/dist/games/$slug/index.html"
            cp "source/games/packs/$slug.js" "source/dist/games/packs/$slug.js"
          done

      - name: Verify build output
        run: |
          test -s source/dist/index.html
          for slug in \
            001-arrow-harbor \
            002-harbor-lost-found \
            003-lightkeeper \
            004-one-stroke-courier \
            005-color-customs \
            006-tiny-detective-grid \
            007-bridge-count \
            008-clockwork-repair \
            009-pipe-garden \
            010-daily-clue-board
          do
            test -s "source/dist/games/$slug/index.html"
          done
          for slug in \
            006-tiny-detective-grid \
            007-bridge-count \
            008-clockwork-repair \
            009-pipe-garden \
            010-daily-clue-board
          do
            test -s "source/dist/games/packs/$slug.js"
            grep -q "../packs/$slug.js" "source/dist/games/$slug/index.html"
          done
          grep -q '/Play100/assets/' source/dist/index.html
          grep -q '/Play100/games/001-arrow-harbor/assets/' source/dist/games/001-arrow-harbor/index.html
          grep -q '/Play100/games/002-harbor-lost-found/assets/' source/dist/games/002-harbor-lost-found/index.html

      - name: Publish under /Play100
        run: |
          rm -rf site/Play100
          mkdir -p site/Play100
          cp -R source/dist/. site/Play100/
          touch site/Play100/.nojekyll

      - name: Commit deployment
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Play100
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'deploy: publish PLAY100 GAME-001 through GAME-010'
          git push
