name: sync Threecountry SRPG v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-threecountry-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-threecountry-srpg-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout tested all-character pixel SRPG source
        uses: actions/checkout@v4
        with:
          repository: beerAndNacho/Threecountry
          ref: 9b648bc6b8d804bd3f1dbf0f7e7f9bd5525ac29d
          path: _threecountry_srpg

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _threecountry_srpg/package-lock.json

      - name: Verify and build source
        working-directory: _threecountry_srpg
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Replace public SRPG build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf threecountry-v2
          mkdir -p threecountry-v2
          cp -R _threecountry_srpg/dist/. threecountry-v2/
          rm -rf _threecountry_srpg

      - name: Verify deployment graph
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css gameplay-v4.css character-art-v1.css pixel-geometry-fix.css app.js gameplay-v4.js character-art-v1.js engine.js content.js audio.js; do
            test -s "threecountry-v2/${file}"
          done
          grep -q 'character-art-v1.js?v=20260818-10' threecountry-v2/index.html
          grep -q 'character-art-v1.css?v=20260818-10' threecountry-v2/index.html
          grep -q 'pixel-geometry-fix.css?v=20260818-10' threecountry-v2/index.html
          grep -q 'pixel-character-art-ready' threecountry-v2/character-art-v1.js
          grep -q 'heroCount:ORDER.length' threecountry-v2/character-art-v1.js
          grep -q 'drawPortrait' threecountry-v2/character-art-v1.js
          grep -q 'drawSprite' threecountry-v2/character-art-v1.js
          grep -q "'soldier-archer'" threecountry-v2/character-art-v1.js
          grep -q 'battle-unit\[data-pixel-unit\]' threecountry-v2/pixel-geometry-fix.css
          grep -q 'translate:none!important' threecountry-v2/pixel-geometry-fix.css
          grep -q 'animation:none!important' threecountry-v2/pixel-geometry-fix.css
          ! grep -Eq 'raw\.githubusercontent|cdn\.jsdelivr' threecountry-v2/index.html
          ! grep -Eq 'raw\.githubusercontent|cdn\.jsdelivr|ASSET_BASE' threecountry-v2/character-art-v1.js

      - name: Commit public build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add threecountry-v2
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'fix: publish SRPG v0.6.1 visible pixel units'
          git push
