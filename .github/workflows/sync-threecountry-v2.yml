name: sync Threecountry SRPG v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-threecountry-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-threecountry-srpg-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout tested SRPG v0.4 source
        uses: actions/checkout@v4
        with:
          repository: beerAndNacho/Threecountry
          ref: dc4d1ac7828dc97896b2aab4cd9267af2ff57b41
          path: _threecountry_srpg

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _threecountry_srpg/package-lock.json

      - name: Verify and build source
        working-directory: _threecountry_srpg
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Replace public SRPG build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf threecountry-v2
          mkdir -p threecountry-v2
          cp -R _threecountry_srpg/dist/. threecountry-v2/
          rm -rf _threecountry_srpg

      - name: Verify deployment graph
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css gameplay-v4.css app.js gameplay-v4.js engine.js content.js audio.js; do
            test -s "threecountry-v2/${file}"
          done
          grep -q 'gameplay-v4.js' threecountry-v2/index.html
          grep -q 'battle-unit\[data-v4="compact"\]' threecountry-v2/gameplay-v4.css
          grep -q 'village-smoke' threecountry-v2/gameplay-v4.js
          ! grep -q 'cdn.jsdelivr.net' threecountry-v2/index.html

      - name: Commit public build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add threecountry-v2
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'feat: publish SRPG v0.4 animated battlefield'
          git push
