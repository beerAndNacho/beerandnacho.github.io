name: sync Threecountry SRPG v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-threecountry-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-threecountry-srpg-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout tested SRPG v0.5 source
        uses: actions/checkout@v4
        with:
          repository: beerAndNacho/Threecountry
          ref: 8326c91a3edbb252c995a981599bbf98f8756961
          path: _threecountry_srpg

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _threecountry_srpg/package-lock.json

      - name: Verify and build source
        working-directory: _threecountry_srpg
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Replace public SRPG build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf threecountry-v2
          mkdir -p threecountry-v2
          cp -R _threecountry_srpg/dist/. threecountry-v2/
          rm -rf _threecountry_srpg

      - name: Verify deployment graph
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css gameplay-v4.css character-art-v1.css app.js gameplay-v4.js character-art-v1.js engine.js content.js audio.js; do
            test -s "threecountry-v2/${file}"
          done
          test -s threecountry-v2/assets/character-art-v1/portraits-v1-sm.b64.part00
          for suffix in 00 01 02 03 04; do
            test -s "threecountry-v2/assets/character-art-v1/sprites-v1-sm.b64.part${suffix}"
          done
          grep -q 'character-art-v1.js' threecountry-v2/index.html
          grep -q 'character-art-v1.css' threecountry-v2/index.html
          grep -q 'premium-character-art-ready' threecountry-v2/character-art-v1.js
          grep -q 'battle-unit\[data-v4="compact"\]' threecountry-v2/gameplay-v4.css
          ! grep -q 'cdn.jsdelivr.net' threecountry-v2/index.html

      - name: Commit public build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add threecountry-v2
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'feat: publish SRPG v0.5 premium character art'
          git push
