name: publish Threecountry release foundation v1.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-threecountry-release-v120.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-threecountry-release-foundation-v120
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout commercial alpha source
        uses: actions/checkout@v4
        with:
          repository: beerAndNacho/Threecountry
          ref: commercial-alpha
          path: _threecountry_commercial

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _threecountry_commercial/package-lock.json

      - name: Build, unit test and simulate 1,000 battles
        working-directory: _threecountry_commercial
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run quality
          for file in index.html character-art-v2.js story-director-v2.js operation-campaign-v1.js operation-maps-v1.js save-slots-v1.js tutorial-v1.js; do
            test -s "dist/$file"
          done
          grep -q 'Release Foundation Alpha' dist/index.html
          ! grep -q 'character-art-v1' dist/index.html

      - name: Install Chromium gate runtime
        working-directory: _threecountry_commercial
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run 390x844 product gate
        working-directory: _threecountry_commercial
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/threecountry-v120-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsSL http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          cat > verify-release-v120.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
          await context.addInitScript(() => {
            localStorage.setItem('threecountry:srpg:v2', JSON.stringify({
              version: 2,
              screen: 'hub',
              resources: { gold: 900, grain: 760, fame: 20 },
              facilities: { barracks: 1, market: 1, granary: 1, academy: 1 },
              party: ['cao', 'xiahou', 'dian', 'guo'],
              strategy: 'assault',
              chapterCleared: false,
              battle: null,
              records: { victories: 0, defeats: 0, bestTurns: null },
              settings: { difficulty: 'normal', zoom: 'normal' },
              lastRewards: null,
            }));
            localStorage.removeItem('threecountry:operation-campaign:v1');
            localStorage.removeItem('threecountry:save-slots:v1');
            localStorage.setItem('threecountry:tutorial:v1', JSON.stringify({ version: '1.2.0', running: false, dismissed: true, completed: [], lastStep: '' }));
          });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
          page.on('requestfailed', (request) => errors.push(`requestfailed: ${request.url()} ${request.failure()?.errorText || ''}`));
          const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 120000 });
          if (!response?.ok()) throw new Error(`HTTP ${response?.status()}`);
          for (const expression of [
            'window.__commercialCharacterArtV2?.ready === true',
            'window.__operationCampaignV1?.ready === true',
            'window.__operationMapsV1?.ready === true',
            'window.__saveSlotsV1?.ready === true',
            'window.__tutorialV1?.ready === true',
          ]) await page.waitForFunction(expression, undefined, { timeout: 30000 });

          const art = await page.evaluate(() => window.__commercialCharacterArtV2);
          const operations = await page.evaluate(() => window.__operationCampaignV1);
          const maps = await page.evaluate(() => window.__operationMapsV1);
          const slots = await page.evaluate(() => window.__saveSlotsV1);
          const tutorial = await page.evaluate(() => window.__tutorialV1);
          if (art.renderer !== 'vector-svg' || art.heroCount !== 12 || art.states.length !== 8) throw new Error(`art gate ${JSON.stringify(art)}`);
          if (operations.operations.length !== 4) throw new Error(`operation gate ${JSON.stringify(operations)}`);
          if (maps.mapCount !== 4 || maps.validationErrors.length) throw new Error(`map gate ${JSON.stringify(maps)}`);
          if (slots.slotCount !== 3 || slots.filledSlots < 1) throw new Error(`slot gate ${JSON.stringify(slots)}`);
          if (tutorial.stepCount !== 15) throw new Error(`tutorial gate ${JSON.stringify(tutorial)}`);

          await page.locator('[data-ocv1-board]').waitFor({ state: 'visible', timeout: 30000 });
          if (await page.locator('[data-omap-thumb]').count() !== 4) throw new Error('four operation thumbnails were not rendered');
          const thumbnailCells = await page.locator('[data-omap-thumb]').evaluateAll((nodes) => nodes.map((node) => node.querySelectorAll('i').length));
          if (thumbnailCells.some((count) => count !== 96)) throw new Error(`thumbnail cell mismatch ${thumbnailCells}`);

          await page.locator('[data-ssv1-open]').first().click();
          await page.locator('[data-ssv1-modal]').waitFor({ state: 'visible', timeout: 15000 });
          if (await page.locator('[data-ssv1-slot]').count() !== 3) throw new Error('three save slots were not rendered');
          await page.locator('[data-ssv1-save="2"]').click();
          await page.waitForFunction(() => window.__saveSlotsV1?.filledSlots === 2, undefined, { timeout: 10000 });
          const slotState = await page.evaluate(() => JSON.parse(localStorage.getItem('threecountry:save-slots:v1') || 'null'));
          if (!slotState?.slots?.[1]?.checksum) throw new Error('slot 2 checksum missing');
          await page.locator('[data-ssv1-close]').last().click();

          await page.locator('[data-tutorial-start]').first().click();
          await page.locator('[data-tutorial-v1]').waitFor({ state: 'visible', timeout: 15000 });
          if (await page.locator('.tutorial-target-v1').count() < 1) throw new Error('tutorial live target missing');
          await page.locator('[data-tutorial-skip]').click();

          await page.locator('[data-ocv1-difficulty]').selectOption('hard');
          await page.locator('[data-ocv1-start]').click();
          await page.locator('.deployment-screen').waitFor({ state: 'visible', timeout: 30000 });
          const preview = page.locator('.preview-grid[data-operation-map="west-road"]');
          await preview.waitFor({ state: 'visible', timeout: 30000 });
          if (await preview.locator(':scope > .terrain').count() !== 96) throw new Error('deployment preview is not 12x8');

          await page.locator('[data-action="start-battle"]').click();
          await page.waitForFunction(() => JSON.parse(localStorage.getItem('threecountry:srpg:v2') || 'null')?.battle?.flags?.operationMapVersion === '1.1.0', undefined, { timeout: 60000 });
          await page.locator('.battle-screen[data-operation-map="west-road"]').waitFor({ state: 'visible', timeout: 30000 });
          if (errors.length) throw new Error(errors.join('\n'));
          console.log(JSON.stringify({ art, operations: operations.operations.length, maps: maps.mapCount, slots, tutorial, thumbnailCells }, null, 2));
          await browser.close();
          EOF
          node verify-release-v120.mjs 2>&1 | tee /tmp/threecountry-v120-browser.log

      - name: Publish browser-verified build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf threecountry-commercial
          mkdir -p threecountry-commercial
          cp -R _threecountry_commercial/dist/. threecountry-commercial/
          rm -rf _threecountry_commercial
          printf '%s\n' 'Threecountry release foundation alpha v1.2.0 browser-verified' > threecountry-commercial/verified.txt
          cat > threecountry-commercial/quality-status.json <<EOF
          {
            "status": "success",
            "version": "1.2.0",
            "unitTests": "passed",
            "simulations": 1000,
            "browserGate": "390x844 Chromium",
            "runId": "${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}"
          }
          EOF
          rm -f threecountry-commercial/quality-failure.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add threecountry-commercial
          git commit -m 'deploy: publish browser-verified Threecountry v1.2.0' || exit 0
          git push

      - name: Persist failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p threecountry-commercial
          cat > threecountry-commercial/quality-status.json <<EOF
          {
            "status": "failure",
            "version": "1.2.0",
            "runId": "${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}"
          }
          EOF
          if [ -s /tmp/threecountry-v120-browser.log ]; then
            tail -n 160 /tmp/threecountry-v120-browser.log > threecountry-commercial/quality-failure.log
          elif [ -s /tmp/threecountry-v120-server.log ]; then
            tail -n 160 /tmp/threecountry-v120-server.log > threecountry-commercial/quality-failure.log
          else
            printf '%s\n' 'Failure occurred before browser diagnostics were created.' > threecountry-commercial/quality-failure.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add threecountry-commercial/quality-status.json threecountry-commercial/quality-failure.log
          git commit -m 'ci: record Threecountry v1.2.0 gate failure' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
