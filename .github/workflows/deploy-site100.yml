name: Deploy Site100 into user Pages site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site100.yml'
      - '.github/site100-v5-trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site100.yml'
      - '.github/site100-v5-pr-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site100-user-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout latest Pages main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0

      - name: Checkout Site100 main
        uses: actions/checkout@v4
        with:
          repository: beerAndNacho/Site100
          ref: main
          path: source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser audit dependencies
        working-directory: source
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Validate, build and audit Site100 v5.0.2
        working-directory: source
        run: npm run test:deep

      - name: Verify v5.0.2 deep build output
        run: |
          set -euo pipefail
          echo 'Publishing Site100 deep information architecture v5.0.2.'

          test -s source/dist/index.html
          test -s source/dist/assets/catalog.js
          test -s source/dist/assets/copy.js
          test -s source/dist/assets/copy-bootstrap.js
          test -s source/dist/assets/app.js
          test -s source/dist/assets/enhance.js
          test -s source/dist/assets/enhance-fix.js
          test -s source/dist/assets/art-direction.js
          test -s source/dist/assets/responsive.js
          test -s source/dist/assets/responsive-fixes.js
          test -s source/dist/assets/depth-content.js
          test -s source/dist/assets/depth.js
          test -s source/dist/assets/styles.css
          test -s source/dist/assets/v2.css
          test -s source/dist/assets/v3.css
          test -s source/dist/assets/v4-responsive.css
          test -s source/dist/assets/v4-responsive-fixes.css
          test -s source/dist/assets/v4-fixes.css
          test -s source/dist/assets/v5-depth.css
          test -s source/dist/assets/v5-depth-fixes.css
          test -s source/dist/manifest.json
          test -s source/dist/depth-manifest.json
          test -s source/dist/depth-audit-report.json
          test -s source/dist/depth-seo-audit-report.json
          test -s source/dist/responsive-matrix.json
          test -s source/dist/responsive-static-report.json
          test -s source/dist/reports/responsive-browser-report.json
          test -s source/dist/reports/depth-browser-report.json
          test -s source/dist/site.webmanifest
          test -s source/dist/icon.svg
          test -s source/dist/404.html
          test -s source/dist/offline.html

          root_count="$(find source/dist/sites -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')"
          page_count="$(find source/dist/sites -name index.html | wc -l | tr -d ' ')"
          design_count="$(find source/dist/sites -mindepth 2 -maxdepth 2 -name design.json | wc -l | tr -d ' ')"
          site_map_count="$(find source/dist/sites -mindepth 2 -maxdepth 2 -name site-map.json | wc -l | tr -d ' ')"
          preview_count="$(find source/dist/previews -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')"
          artwork_count="$(find source/dist/artworks -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')"
          test "$root_count" -eq 100
          test "$page_count" -eq 1400
          test "$design_count" -eq 100
          test "$site_map_count" -eq 100
          test "$preview_count" -eq 100
          test "$artwork_count" -eq 100

          grep -q '"depthVersion": "5.0.0"' source/dist/manifest.json
          grep -q '"depthPatchVersion": "5.0.1"' source/dist/manifest.json
          grep -q '"depthSeoPatchVersion": "5.0.2"' source/dist/manifest.json
          grep -q '"sitePageCount": 1400' source/dist/manifest.json
          grep -q '"pagesPerSite": 14' source/dist/depth-manifest.json
          grep -q '"maximumDepth": 3' source/dist/depth-manifest.json
          grep -q '"sitePages": 1400' source/dist/depth-audit-report.json
          grep -q '"brokenLinks": 0' source/dist/depth-audit-report.json
          grep -q '"checkedDeepPages": 1300' source/dist/depth-seo-audit-report.json
          grep -q '"duplicateBasePaths": 0' source/dist/depth-seo-audit-report.json
          grep -q '"malformedBreadcrumbs": 0' source/dist/depth-seo-audit-report.json
          grep -q '"KoreanParticleFailures": 0' source/dist/depth-seo-audit-report.json
          grep -q '/Site100/assets/depth.js' source/dist/index.html
          grep -q '/Site100/assets/v5-depth.css' source/dist/index.html
          grep -q '/Site100/assets/v5-depth-fixes.css' source/dist/index.html

          test -s source/dist/sites/salt-bakery/about/index.html
          test -s source/dist/sites/salt-bakery/services/index.html
          test -s source/dist/sites/salt-bakery/services/service-01/index.html
          test -s source/dist/sites/salt-bakery/work/index.html
          test -s source/dist/sites/salt-bakery/work/case-01/index.html
          test -s source/dist/sites/salt-bakery/journal/index.html
          test -s source/dist/sites/salt-bakery/journal/insight-01/index.html
          test -s source/dist/sites/salt-bakery/contact/index.html
          test -s source/dist/sites/desktop-cv/services/service-01/index.html
          test -s source/dist/sites/100worlds-gallery/journal/insight-02/index.html

          grep -q 'data-v5-add-service' source/dist/sites/salt-bakery/services/service-01/index.html
          grep -q 'data-v5-wizard' source/dist/sites/salt-bakery/contact/index.html
          grep -q 'data-v5-article' source/dist/sites/salt-bakery/journal/insight-01/index.html
          grep -q '"pageCount": 14' source/dist/sites/salt-bakery/design.json
          grep -q '"depthPatchVersion": "5.0.1"' source/dist/sites/salt-bakery/design.json
          grep -q '"depthSeoPatchVersion": "5.0.2"' source/dist/sites/salt-bakery/design.json
          grep -q '<link rel="canonical" href="https://beerandnacho.github.io/Site100/sites/salt-bakery/about/">' source/dist/sites/salt-bakery/about/index.html
          grep -q '<meta property="og:url" content="https://beerandnacho.github.io/Site100/sites/salt-bakery/about/">' source/dist/sites/salt-bakery/about/index.html
          grep -q '소금결 베이커리가 만드는' source/dist/sites/salt-bakery/about/index.html
          grep -q '소금결 베이커리는 베이커리' source/dist/sites/salt-bakery/about/index.html
          if grep -R -q 'https://beerandnacho.github.io/Site100/Site100/' source/dist/sites source/dist/sitemap.xml; then
            echo 'Duplicate Site100 base path remains.'
            exit 1
          fi

          node -e "const responsive=require('./source/dist/reports/responsive-browser-report.json'); if(responsive.failures.length) process.exit(1); if(responsive.checks!==262) throw new Error('Expected 262 responsive checks, got '+responsive.checks); const depth=require('./source/dist/reports/depth-browser-report.json'); if(depth.failures.length) process.exit(1); if(depth.checks!==520) throw new Error('Expected 520 deep checks, got '+depth.checks); const seo=require('./source/dist/depth-seo-audit-report.json'); if(seo.failures.length) process.exit(1); if(seo.checkedDeepPages!==1300) throw new Error('Expected 1300 deep SEO checks, got '+seo.checkedDeepPages); console.log('Verified '+responsive.checks+' responsive, '+depth.checks+' deep browser and '+seo.checkedDeepPages+' deep SEO checks.');"

      - name: Publish under /Site100
        run: |
          rm -rf site/Site100
          mkdir -p site/Site100
          cp -R source/dist/. site/Site100/
          touch site/Site100/.nojekyll

      - name: Commit deployment to main
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Site100
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'deploy: publish Site100 deep architecture v5.0.2'
          git pull --rebase origin main
          git push origin HEAD:main
