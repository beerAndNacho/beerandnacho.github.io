name: Deploy Site100 into user Pages site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site100.yml'
      - '.github/site100-v4-trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site100.yml'
      - '.github/site100-v4-pr-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site100-user-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest Pages main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0

      - name: Checkout Site100 main
        uses: actions/checkout@v4
        with:
          repository: beerAndNacho/Site100
          ref: main
          path: source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install responsive browser audit dependencies
        working-directory: source
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Validate, build and audit Site100 responsive v4
        working-directory: source
        run: npm run test:responsive

      - name: Verify responsive v4 build output
        run: |
          set -euo pipefail
          echo 'Publishing Site100 responsive web-app v4.'
          test -s source/dist/index.html
          test -s source/dist/assets/catalog.js
          test -s source/dist/assets/copy.js
          test -s source/dist/assets/copy-bootstrap.js
          test -s source/dist/assets/app.js
          test -s source/dist/assets/enhance.js
          test -s source/dist/assets/enhance-fix.js
          test -s source/dist/assets/art-direction.js
          test -s source/dist/assets/responsive.js
          test -s source/dist/assets/responsive-fixes.js
          test -s source/dist/assets/styles.css
          test -s source/dist/assets/v2.css
          test -s source/dist/assets/v3.css
          test -s source/dist/assets/v4-responsive.css
          test -s source/dist/assets/v4-responsive-fixes.css
          test -s source/dist/assets/v4-fixes.css
          test -s source/dist/manifest.json
          test -s source/dist/responsive-matrix.json
          test -s source/dist/responsive-static-report.json
          test -s source/dist/reports/responsive-browser-report.json
          test -s source/dist/site.webmanifest
          test -s source/dist/icon.svg
          test -s source/dist/404.html
          test -s source/dist/offline.html

          route_count="$(find source/dist/sites -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')"
          design_count="$(find source/dist/sites -mindepth 2 -maxdepth 2 -name design.json | wc -l | tr -d ' ')"
          preview_count="$(find source/dist/previews -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')"
          artwork_count="$(find source/dist/artworks -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')"
          test "$route_count" -eq 100
          test "$design_count" -eq 100
          test "$preview_count" -eq 100
          test "$artwork_count" -eq 100

          grep -q '"responsiveVersion": "4.0.0"' source/dist/manifest.json
          grep -q '"responsivePatchVersion": "4.0.1"' source/dist/manifest.json
          grep -q '"routeCoverage": 100' source/dist/manifest.json
          grep -q '/Site100/assets/responsive.js' source/dist/index.html
          grep -q '/Site100/assets/responsive-fixes.js' source/dist/index.html
          grep -q '/Site100/assets/v4-responsive.css' source/dist/index.html
          grep -q '/Site100/assets/v4-responsive-fixes.css' source/dist/index.html
          grep -q '/Site100/assets/v4-fixes.css' source/dist/index.html
          grep -q '"responsiveVersion": "4.0.0"' source/dist/sites/salt-bakery/design.json
          grep -q '"responsivePatchVersion": "4.0.1"' source/dist/sites/salt-bakery/design.json
          grep -q '"strategy": "viewport-and-container-queries"' source/dist/sites/salt-bakery/design.json
          grep -q '"visualVersion": "3.0.0"' source/dist/sites/salt-bakery/design.json

          node -e "const report=require('./source/dist/reports/responsive-browser-report.json'); if(report.failures.length) process.exit(1); if(report.checks!==262) throw new Error('Expected 262 responsive browser checks, got '+report.checks); console.log('Verified '+report.checks+' responsive browser checks.');"

      - name: Publish under /Site100
        run: |
          rm -rf site/Site100
          mkdir -p site/Site100
          cp -R source/dist/. site/Site100/
          touch site/Site100/.nojekyll

      - name: Commit deployment to main
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Site100
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'deploy: publish Site100 responsive web-app v4'
          git pull --rebase origin main
          git push origin HEAD:main
