name: Deploy Site100 into user Pages site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site100.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site100.yml'
      - '.github/site100-v2-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site100-user-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest Pages main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0

      - name: Checkout Site100 main
        uses: actions/checkout@v4
        with:
          repository: beerAndNacho/Site100
          ref: main
          path: source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate, build and audit Site100 v2.1
        working-directory: source
        run: npm test

      - name: Verify v2.1 build output
        run: |
          set -euo pipefail
          echo 'Publishing Site100 verified build v2.1 from source main.'
          test -s source/dist/index.html
          test -s source/dist/assets/catalog.js
          test -s source/dist/assets/copy.js
          test -s source/dist/assets/copy-bootstrap.js
          test -s source/dist/assets/app.js
          test -s source/dist/assets/enhance.js
          test -s source/dist/assets/enhance-fix.js
          test -s source/dist/assets/styles.css
          test -s source/dist/assets/v2.css
          test -s source/dist/manifest.json
          test -s source/dist/site.webmanifest
          test -s source/dist/icon.svg
          test -s source/dist/404.html
          test -s source/dist/offline.html
          test -s source/dist/preview-gallery.svg
          route_count="$(find source/dist/sites -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')"
          design_count="$(find source/dist/sites -mindepth 2 -maxdepth 2 -name design.json | wc -l | tr -d ' ')"
          preview_count="$(find source/dist/previews -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')"
          test "$route_count" -eq 100
          test "$design_count" -eq 100
          test "$preview_count" -eq 100
          grep -q '"version": "2.0.0"' source/dist/manifest.json
          grep -q '/Site100/assets/copy-bootstrap.js' source/dist/index.html
          grep -q '/Site100/assets/enhance.js' source/dist/index.html
          grep -q '/Site100/assets/enhance-fix.js' source/dist/index.html
          grep -q '/Site100/assets/v2.css' source/dist/index.html
          grep -q 'CollectionPage' source/dist/index.html
          grep -q '오븐 선반과 발효 시계를' source/dist/sites/salt-bakery/index.html
          grep -q '"copyVersion": "2.1.0"' source/dist/sites/salt-bakery/design.json
          test -s source/dist/previews/salt-bakery.svg
          test -s source/dist/previews/endpoint-api.svg
          test -s source/dist/previews/dal-hanok-stay.svg
          test -s source/dist/sites/salt-bakery/index.html
          test -s source/dist/sites/harbor-law/index.html
          test -s source/dist/sites/endpoint-api/index.html
          test -s source/dist/sites/compile-bootcamp/index.html
          test -s source/dist/sites/still-yoga/index.html
          test -s source/dist/sites/framework-film/index.html
          test -s source/dist/sites/dal-hanok-stay/index.html
          test -s source/dist/sites/table7-restaurant/index.html
          test -s source/dist/sites/open-hand-nonprofit/index.html
          test -s source/dist/sites/desktop-cv/index.html
          test -s source/dist/sites/100worlds-gallery/index.html

      - name: Publish under /Site100
        run: |
          rm -rf site/Site100
          mkdir -p site/Site100
          cp -R source/dist/. site/Site100/
          touch site/Site100/.nojekyll

      - name: Commit deployment to main
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Site100
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'deploy: publish Site100 100WORLDS v2.1'
          git pull --rebase origin main
          git push origin HEAD:main
