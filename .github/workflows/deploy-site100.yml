name: Deploy Site100 into user Pages site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site100.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site100.yml'
      - '.github/site100-v3-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site100-user-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest Pages main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0

      - name: Checkout Site100 main
        uses: actions/checkout@v4
        with:
          repository: beerAndNacho/Site100
          ref: main
          path: source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate, build and audit Site100 v3
        working-directory: source
        run: npm test

      - name: Verify v3 build output
        run: |
          set -euo pipefail
          echo 'Publishing Site100 verified visual build v3.'
          test -s source/dist/index.html
          test -s source/dist/assets/catalog.js
          test -s source/dist/assets/copy.js
          test -s source/dist/assets/copy-bootstrap.js
          test -s source/dist/assets/app.js
          test -s source/dist/assets/enhance.js
          test -s source/dist/assets/enhance-fix.js
          test -s source/dist/assets/art-direction.js
          test -s source/dist/assets/styles.css
          test -s source/dist/assets/v2.css
          test -s source/dist/assets/v3.css
          test -s source/dist/manifest.json
          test -s source/dist/site.webmanifest
          test -s source/dist/icon.svg
          test -s source/dist/404.html
          test -s source/dist/offline.html
          test -s source/dist/preview-gallery.svg

          route_count="$(find source/dist/sites -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')"
          design_count="$(find source/dist/sites -mindepth 2 -maxdepth 2 -name design.json | wc -l | tr -d ' ')"
          preview_count="$(find source/dist/previews -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')"
          artwork_count="$(find source/dist/artworks -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')"
          test "$route_count" -eq 100
          test "$design_count" -eq 100
          test "$preview_count" -eq 100
          test "$artwork_count" -eq 100

          grep -q '"visualVersion": "3.0.0"' source/dist/manifest.json
          grep -q '"artworkCount": 100' source/dist/manifest.json
          grep -q '/Site100/assets/copy-bootstrap.js' source/dist/index.html
          grep -q '/Site100/assets/enhance.js' source/dist/index.html
          grep -q '/Site100/assets/enhance-fix.js' source/dist/index.html
          grep -q '/Site100/assets/art-direction.js' source/dist/index.html
          grep -q '/Site100/assets/v3.css' source/dist/index.html
          grep -q 'CollectionPage' source/dist/index.html

          grep -q '"artDirection": "atelier"' source/dist/sites/salt-bakery/design.json
          grep -q '"artDirection": "precision"' source/dist/sites/harbor-law/design.json
          grep -q '"artDirection": "interface"' source/dist/sites/endpoint-api/design.json
          grep -q '"artDirection": "notebook"' source/dist/sites/compile-bootcamp/design.json
          grep -q '"artDirection": "organic"' source/dist/sites/still-yoga/design.json
          grep -q '"artDirection": "studio"' source/dist/sites/framework-film/design.json
          grep -q '"artDirection": "atlas"' source/dist/sites/dal-hanok-stay/design.json
          grep -q '"artDirection": "catalog"' source/dist/sites/table7-restaurant/design.json
          grep -q '"artDirection": "civic"' source/dist/sites/open-hand-nonprofit/design.json
          grep -q '"artDirection": "experimental"' source/dist/sites/desktop-cv/design.json

          test -s source/dist/artworks/salt-bakery.svg
          test -s source/dist/artworks/harbor-law.svg
          test -s source/dist/artworks/endpoint-api.svg
          test -s source/dist/artworks/compile-bootcamp.svg
          test -s source/dist/artworks/still-yoga.svg
          test -s source/dist/artworks/framework-film.svg
          test -s source/dist/artworks/dal-hanok-stay.svg
          test -s source/dist/artworks/table7-restaurant.svg
          test -s source/dist/artworks/open-hand-nonprofit.svg
          test -s source/dist/artworks/desktop-cv.svg
          test -s source/dist/artworks/100worlds-gallery.svg

      - name: Publish under /Site100
        run: |
          rm -rf site/Site100
          mkdir -p site/Site100
          cp -R source/dist/. site/Site100/
          touch site/Site100/.nojekyll

      - name: Commit deployment to main
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Site100
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'deploy: publish Site100 100WORLDS v3'
          git pull --rebase origin main
          git push origin HEAD:main
