name: sync Threecountry assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-threecountry.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-threecountry-assets
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout tested cinematic Threecountry source
        uses: actions/checkout@v4
        with:
          repository: beerAndNacho/Threecountry
          ref: 14499f07e3b22e59979f61ac9c5912138c28ad2b
          path: _threecountry_source

      - name: Build game
        working-directory: _threecountry_source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --test tests/*.test.mjs

      - name: Replace public game with tested build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf threecountry
          mkdir -p threecountry
          cp -R _threecountry_source/dist/. threecountry/
          rm -rf _threecountry_source

      - name: Verify cinematic deployment graph
        shell: bash
        run: |
          set -euo pipefail
          test -s threecountry/index.html
          test -s threecountry/styles.css
          test -s threecountry/presentation-core.css
          test -s threecountry/presentation-scenes.css
          for file in main presentation content engine battle rng storage; do
            test -s "threecountry/assets/${file}.js"
          done
          grep -q './assets/presentation.js' threecountry/index.html
          grep -q './presentation-core.css' threecountry/index.html
          grep -q './presentation-scenes.css' threecountry/index.html
          ! grep -q 'cdn.jsdelivr.net/gh/beerAndNacho/Threecountry' threecountry/index.html

      - name: Commit deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add threecountry
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'feat: publish cinematic Threecountry game'
          git push
