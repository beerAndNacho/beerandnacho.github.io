<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#1d2730"><meta name="description" content="One-Stroke Courier — 도시의 모든 도로를 한 번씩만 달려 소포를 전달하는 경로 퍼즐."><title>One-Stroke Courier — PLAY100 GAME-004</title><style>html,body{margin:0;min-height:100%;background:#1d2730;color:#f2ecdf;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center}.loading b{display:block;font-size:28px;margin-bottom:8px}.loading span{opacity:.7;font-size:13px}</style></head><body><div class="loading"><div><b>ONE-STROKE COURIER</b><span>도시 배달 지도를 준비하는 중</span></div></div><script>(async()=>{try{const names=['payload-0.txt','payload-1.txt'];const parts=await Promise.all(names.map(n=>fetch(n+'?v=1').then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const binary=atob(parts.join('').trim());const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><b>로딩 실패</b><span>페이지를 새로고침해 주세요.</span></div></div>'}})();</script></body></html>
