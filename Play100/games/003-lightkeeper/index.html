<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#102f3a"><meta name="description" content="Lightkeeper — 거울탑을 회전해 등대의 빛을 모든 항로 신호에 연결하는 광학 퍼즐."><title>Lightkeeper — PLAY100 GAME-003</title><style>html,body{margin:0;min-height:100%;background:#102f3a;color:#f1ede1;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center}.loading b{display:block;font-size:28px;margin-bottom:8px}.loading span{opacity:.7;font-size:13px}</style></head><body><div class="loading"><div><b>LIGHTKEEPER</b><span>등대 광로를 준비하는 중</span></div></div><script>(async()=>{try{const names=['payload-0.txt','payload-1.txt'];const parts=await Promise.all(names.map(n=>fetch(n+'?v=1').then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const binary=atob(parts.join('').trim());const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><b>로딩 실패</b><span>페이지를 새로고침해 주세요.</span></div></div>'}})();</script></body></html>
