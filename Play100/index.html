<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102630"><meta name="description" content="PLAY100 — 제목과 세계관, 조작이 연결된 오리지널 브라우저 게임 100개."><title>PLAY100 — 100 Browser Games</title><link rel="stylesheet" href="/Play100/v2/style.css"></head><body><div class="portal"><header class="topbar"><a class="brand" href="/Play100/"><i></i>PLAY100</a><div class="top-meta"><span>100 ORIGINAL GAMES</span><a href="https://github.com/beerAndNacho/Play100">GITHUB</a></div></header><section class="portal-hero"><div class="portal-copy"><div class="eyebrow">PLAYABLE WEB ARCADE · 001—100</div><h1>제목이<br><em>게임이</em><br>됩니다.</h1><p>추상 도형에 이름만 붙이지 않습니다. 장소, 역할, 사물, 조작과 피드백이 제목의 약속을 실제 플레이로 이어갑니다.</p></div><div class="daily"><div class="daily-card" id="daily"></div></div></section><main class="catalog"><div class="catalog-head"><div><div class="eyebrow">MASTER GAME INDEX</div><h2>게임 100개</h2></div><input class="search" id="search" type="search" placeholder="제목·소재·장르 검색"></div><div class="tabs" id="tabs"></div><div id="list"></div></main></div><script src="/Play100/v2/catalog.js"></script><script>const C=window.PLAY100_CATALOG,$=s=>document.querySelector(s),cats=['All',...new Set(C.map(g=>g.category))];let cat='All',q='';const day=C[(new Date().getDate()+new Date().getMonth()*31)%C.length];$('#daily').innerHTML='<div class="eyebrow">TODAY · GAME-'+String(day.id).padStart(3,'0')+'</div><h2>'+day.title+'</h2><p>'+day.description+'</p><a href="'+day.path+'">게임 시작 →</a>';function tabs(){$('#tabs').innerHTML=cats.map(x=>'<button class="tab '+(x===cat?'on':'')+'" data-c="'+x+'">'+x+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cat=b.dataset.c;tabs();list()})}function list(){const n=q.trim().toLowerCase();$('#list').innerHTML=C.filter(g=>(cat==='All'||g.category===cat)&&(!n||(g.title+' '+g.description+' '+g.category+' '+(g.objects||[]).join(' ')).toLowerCase().includes(n))).map(g=>'<a class="game-row" href="'+g.path+'"><span class="game-no">GAME-'+String(g.id).padStart(3,'0')+'</span><h3>'+g.title+'</h3><span class="game-cat">'+g.category+'</span><p>'+g.description+'</p><span class="game-go">PLAY →</span></a>').join('')}$('#search').oninput=e=>{q=e.target.value;list()};tabs();list();</script></body></html>
